services:
    mysql:
        image: mariadb:11.8
        environment:
            MARIADB_DATABASE: drupal
            MARIADB_USER: user
            MARIADB_PASSWORD: password
            MARIADB_ROOT_PASSWORD: password
        volumes:
            - drupal_mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "healthcheck.sh",
                    "--connect",
                    "--innodb_initialized"
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    # The Drupal container.
    # Accessible on http://localhost:8091
    drupal:
        build:
            context: ./drupal
            args:
                UID: ${HOST_UID:?HOST_UID is required}
                GID: ${HOST_GID:?HOST_GID is required}
                USER: ${HOST_USER:?HOST_USER is required}
                GROUP: ${HOST_GROUP:?HOST_GROUP is required}
        volumes:
            # Persist the Drupal config in volumes
            - drupal_modules:/var/www/drupal/web/modules
            - drupal_profiles:/var/www/drupal/web/profiles
            - drupal_themes:/var/www/drupal/web/themes
            - drupal_sites:/var/www/drupal/web/sites
            # Mount the code of this project in the docker container
            - ..:/var/www/drupal/web/modules/drupal-8-module-iform
        ports: 
            - "8091:80"
        depends_on:
            mysql:
                condition: service_healthy

volumes:
    drupal_mysql:
    drupal_modules:
    drupal_profiles:
    drupal_themes:
    drupal_sites: